name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      # Continue if tests fail so the report is still generated
      continue-on-error: true

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # NEW STEP: Upload report for online viewing
    - name: Upload HTML report
      uses: actions/upload-pages-artifact@v3
      with:
        name: playwright-html-report
        path: playwright-report/

  # NEW JOB: Deploy the report to GitHub Pages
  deploy-report:
    # Only run if the test job completed (even if tests failed)
    if: ${{ !cancelled() && always() }}
    needs: test
    
    # Grant permissions to deploy to Pages
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: playwright-html-report
